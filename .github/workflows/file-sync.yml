name: update files with file-sync
on:
  workflow_dispatch:
  schedule:
    # At 03:03 on Tuesday
    - cron: '3 3 * * 2'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - run: ./.github/sync.sh Bioconductor/bioconductor.org config.yaml .bioconductor_config.yaml

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "update bioconductor config file"
